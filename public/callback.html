<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anmeldung …</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             background: #0E0E10; color: #F4F4F5; font: 16px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <p>Anmeldung wird abgeschlossen …</p>
    <script>
      // OAuth redirect target for HiDrive (F1 §4). A real static file, so GitHub Pages
      // serves it without the SPA fallback. It hands the query (code/state/error) to the
      // app and returns to the start page. The token exchange itself happens in the app (M1).
      try { sessionStorage.setItem('bandapp.oauthCallback', location.search); } catch (e) {}
      location.replace('./');
    </script>
  </body>
</html>
